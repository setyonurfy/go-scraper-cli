name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Vet, Test (Race), and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod and go.sum
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests with race detector
        run: go test -race -v ./...

      - name: Build binary
        run: go build -o /dev/null ./cmd/scraper